name: Actualizar datos Control Costos

on:
  schedule:
    # 7:00am Colombia (COT = UTC-5) → 12:00 UTC  · lunes a viernes
    - cron: '17 12 * * 1-5'
  push:
    branches: [main]
  workflow_dispatch:
    # También se puede lanzar manualmente desde GitHub → Actions → Run workflow

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout remote-costos
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      # ── 2. Python ─────────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install msal requests openpyxl

      # ── 3. Scripts SINCO ──────────────────────────────────────────────────
      # Los scripts leen SINCO_USER y SINCO_PASS del entorno.
      # OUTPUT_DIR apunta a public/data/ dentro del checkout.
      - name: gen_contracts_api
        env:
          SINCO_USER: ${{ secrets.SINCO_USER }}
          SINCO_PASS: ${{ secrets.SINCO_PASS }}
          OUTPUT_DIR: ${{ github.workspace }}/public/data
        run: python scripts/sinco/gen_contracts_api.py
        timeout-minutes: 15

      - name: gen_balance_api
        env:
          SINCO_USER: ${{ secrets.SINCO_USER }}
          SINCO_PASS: ${{ secrets.SINCO_PASS }}
          OUTPUT_DIR: ${{ github.workspace }}/public/data
        run: python scripts/sinco/gen_balance_api.py
        timeout-minutes: 15

      - name: gen_consumido_api
        env:
          SINCO_USER: ${{ secrets.SINCO_USER }}
          SINCO_PASS: ${{ secrets.SINCO_PASS }}
          OUTPUT_DIR: ${{ github.workspace }}/public/data
        run: python scripts/sinco/gen_consumido_api.py
        timeout-minutes: 15

      - name: gen_compras_api
        env:
          SINCO_USER: ${{ secrets.SINCO_USER }}
          SINCO_PASS: ${{ secrets.SINCO_PASS }}
          OUTPUT_DIR: ${{ github.workspace }}/public/data
        run: python scripts/sinco/gen_compras_api.py
        timeout-minutes: 15

      - name: gen_anticipos_api
        env:
          SINCO_USER: ${{ secrets.SINCO_USER }}
          SINCO_PASS: ${{ secrets.SINCO_PASS }}
          OUTPUT_DIR: ${{ github.workspace }}/public/data
        run: python scripts/sinco/gen_anticipos_api.py
        timeout-minutes: 15

      - name: gen_estado_api
        if: true
        env:
          SINCO_USER: ${{ secrets.SINCO_USER }}
          SINCO_PASS: ${{ secrets.SINCO_PASS }}
          OUTPUT_DIR: ${{ github.workspace }}/public/data
        run: python scripts/sinco/gen_estado_api.py
        timeout-minutes: 55
        continue-on-error: true   # No bloquea el deploy si falla

      # ── 4. Actualizar update_manifest con timestamp de hoy ───────────────
      - name: Actualizar update_manifest
        run: |
          python - <<'EOF'
          import json, datetime, os
          path = os.path.join(os.environ['GITHUB_WORKSPACE'], 'public/data/update_manifest.json')
          try:
              with open(path, encoding='utf-8') as f:
                  m = json.load(f)
          except Exception:
              m = {}
          m['last_run'] = datetime.datetime.utcnow().strftime('%d %b %Y %H:%M')
          m['all_ok'] = True
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(m, f, ensure_ascii=False)
          print('update_manifest actualizado:', m['last_run'])
          EOF

      # ── 5. Commit y push → Azure SWA construye automáticamente ───────────
      - name: Commit JSON actualizados
        run: |
          git config user.name  "IC-Bot"
          git config user.email "bot@icconstructora.co"
          git add public/data/*.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los JSON — nada que commitear"
          else
            git commit -m "Data update $(date +'%d %b %Y %H:%M') UTC"
            git pull origin main --no-rebase -X ours
            git push
          fi
