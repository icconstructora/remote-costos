name: Actualizar datos Control Costos

on:
  schedule:
    # 07:12am Colombia (COT = UTC-5) → 12:12 UTC · lunes a viernes
    - cron: '12 12 * * 1-5'
  workflow_dispatch:
    # También se puede lanzar manualmente desde GitHub → Actions → Run workflow

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout remote-costos
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      # ── 2. Python ─────────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install msal requests openpyxl

      # ── 3. Scripts SINCO ──────────────────────────────────────────────────
      # Los scripts leen SINCO_USER y SINCO_PASS del entorno.
      # OUTPUT_DIR apunta a public/data/ dentro del checkout.
      - name: gen_contracts_api
        env:
          SINCO_USER: ${{ secrets.SINCO_USER }}
          SINCO_PASS: ${{ secrets.SINCO_PASS }}
          OUTPUT_DIR: ${{ github.workspace }}/public/data
        run: python scripts/sinco/gen_contracts_api.py
        timeout-minutes: 15

      - name: gen_balance_api
        env:
          SINCO_USER: ${{ secrets.SINCO_USER }}
          SINCO_PASS: ${{ secrets.SINCO_PASS }}
          OUTPUT_DIR: ${{ github.workspace }}/public/data
        run: python scripts/sinco/gen_balance_api.py
        timeout-minutes: 15

      - name: gen_consumido_api
        env:
          SINCO_USER: ${{ secrets.SINCO_USER }}
          SINCO_PASS: ${{ secrets.SINCO_PASS }}
          OUTPUT_DIR: ${{ github.workspace }}/public/data
        run: python scripts/sinco/gen_consumido_api.py
        timeout-minutes: 30

      - name: gen_proyecciones_api
        env:
          SINCO_USER: ${{ secrets.SINCO_USER }}
          SINCO_PASS: ${{ secrets.SINCO_PASS }}
          OUTPUT_DIR: ${{ github.workspace }}/public/data
        run: python scripts/sinco/gen_proyecciones_api.py
        timeout-minutes: 15

      - name: gen_compras_api
        env:
          SINCO_USER: ${{ secrets.SINCO_USER }}
          SINCO_PASS: ${{ secrets.SINCO_PASS }}
          OUTPUT_DIR: ${{ github.workspace }}/public/data
        run: python scripts/sinco/gen_compras_api.py
        timeout-minutes: 15

      - name: gen_anticipos_api
        env:
          SINCO_USER: ${{ secrets.SINCO_USER }}
          SINCO_PASS: ${{ secrets.SINCO_PASS }}
          OUTPUT_DIR: ${{ github.workspace }}/public/data
        run: python scripts/sinco/gen_anticipos_api.py
        timeout-minutes: 15

      - name: gen_estado_api
        if: true
        env:
          SINCO_USER: ${{ secrets.SINCO_USER }}
          SINCO_PASS: ${{ secrets.SINCO_PASS }}
          OUTPUT_DIR: ${{ github.workspace }}/public/data
        run: python scripts/sinco/gen_estado_api.py
        timeout-minutes: 55
        continue-on-error: true   # No bloquea el deploy si falla

      # ── 4. Actualizar update_manifest con timestamps reales de cada JSON ───
      - name: Actualizar update_manifest
        run: |
          python - <<'EOF'
          import json, datetime, os

          DATA = os.path.join(os.environ['GITHUB_WORKSPACE'], 'public/data')
          path = os.path.join(DATA, 'update_manifest.json')

          try:
              with open(path, encoding='utf-8') as f:
                  m = json.load(f)
          except Exception:
              m = {}

          cot = datetime.timezone(datetime.timedelta(hours=-5))
          now_str = datetime.datetime.now(cot).strftime('%d %b %Y %H:%M')
          m['last_run'] = now_str

          # Leer generated_at real de cada archivo JSON
          API_SCRIPTS = [
              ('estado',    'estado_detalle_data.json',  'Estado del Proyecto'),
              ('contratos', 'contracts_data.json',       'Contratos'),
              ('balance',   'balance_data.json',         'Balance (garantias/anticipos)'),
              ('consumido', 'consumido_data.json',       'Consumido por mes'),
              ('compras',   'compras_data.json',         'Compras ADPRO'),
              ('anticipos', 'anticipos_data.json',       'Anticipos A&F vs ADPRO'),
              ('liquidados','liquidados_data.json',      'Liquidados F029'),
          ]

          scripts = {s['key']: s for s in m.get('scripts', [])}

          for key, fname, label in API_SCRIPTS:
              fpath = os.path.join(DATA, fname)
              ts = now_str
              status = 'error'
              if os.path.exists(fpath):
                  try:
                      d = json.load(open(fpath, encoding='utf-8'))
                      ts = d.get('generated_at') or d.get('corte') or now_str
                      status = 'ok'
                  except Exception:
                      pass
              scripts[key] = {
                  'key': key, 'label': label,
                  'status': status, 'timestamp': ts, 'duracion': 0,
              }

          # Cierre: manual desde Excel — conservar último timestamp conocido
          key, label = 'cierre', 'Cierre Proyecto (Estado Liquidacion)'
          if key not in scripts:
              scripts[key] = {'key': key, 'label': label,
                              'status': 'manual', 'timestamp': '—', 'duracion': 0}
          else:
              scripts[key]['status'] = 'manual'

          # Eliminar entradas obsoletas que ya no tienen script activo
          for obsoleto in ('balance_cierre',):
              scripts.pop(obsoleto, None)

          m['scripts'] = list(scripts.values())
          m['all_ok'] = all(s['status'] in ('ok', 'manual') for s in m['scripts'])

          with open(path, 'w', encoding='utf-8') as f:
              json.dump(m, f, ensure_ascii=False)
          print('update_manifest actualizado:', now_str)
          for s in m['scripts']:
              print(f"  {s['key']:15} {s['status']:6}  {s['timestamp']}")
          EOF

      # ── 5. Commit y push → Azure SWA construye automáticamente ───────────
      - name: Commit JSON actualizados
        run: |
          git config user.name  "IC-Bot"
          git config user.email "bot@icconstructora.co"
          git add public/data/*.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los JSON — nada que commitear"
          else
            git commit -m "Data update $(date +'%d %b %Y %H:%M') UTC"
            git pull origin main --no-rebase -X ours
            git push
          fi
