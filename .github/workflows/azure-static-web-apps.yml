name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and Build
        run: |
          npm ci
          npm run build
          echo "=== dist/ contents ==="
          ls -la dist/
          echo "=== copying standalone pages ==="
          cp staticwebapp.config.json dist/
          cp public/cierre_detalle.html dist/ && echo "OK cierre_detalle.html" || echo "FAIL cierre_detalle.html"
          cp public/cierre_data.js dist/     && echo "OK cierre_data.js"      || echo "FAIL cierre_data.js"
          cp public/balance_data.js dist/    && echo "OK balance_data.js"     || echo "FAIL balance_data.js"
          cp public/liquidados_data.js dist/ && echo "OK liquidados_data.js"  || echo "FAIL liquidados_data.js"
          echo "=== final dist/ ==="
          ls dist/*.html dist/*.js 2>/dev/null || true

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "."
          output_location: dist
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
